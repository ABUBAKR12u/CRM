name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erpcrm
          POSTGRES_PASSWORD: erpcrm
          POSTGRES_DB: erpcrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erpcrm -d erpcrm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: development
      DB_USERNAME: erpcrm
      DB_PASS: erpcrm
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: erpcrm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Create test database
        run: psql postgresql://erpcrm:erpcrm@localhost:5432/erpcrm -c "CREATE DATABASE erpcrm_test"
      - name: Migrations apply cleanly and are reversible
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Models and migrations are in sync
        run: alembic check
      - run: pytest

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: false
          tags: erpcrm-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max